<text x="44" y="198" font-size="21" font-weight="500" fill="#c9c6ff">Farm Management System</text>
<text x="44" y="249" font-size="14" fill="#9a9ba6">Oracle · SQL · PL/SQL · Procedures + Triggers · RBAC</text>
<g transform="translate(470 48) scale(1.35)">

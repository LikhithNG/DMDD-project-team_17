0.35"/><text class="sc-s sc-on-tier" x="265" y="42.5" text-anchor="middle">Cycles</text><path class="sc-line" d="M242 53H284M242 61H274"/><rect class="sc-box" x="164" y="82" width="62" height="34" rx="5"/><rect class="sc-c1" x="164" y="82" width="62" height="11" rx="5" fill-opacity="0.35"/><text class="sc-s sc-on-tier" x="195" y="90.5" text-anchor="middle">Sensors</text><path class="sc-line" d="M172 101H214M172 109H204"/><rect class="sc-box" x="234" y="82" width="62" height="34" rx="5"/><rect class="sc-c1" x="234" y="82" width="62" height="11" rx="5" fill-opacity="0.35"/><text class="sc-s sc-on-tier" x="265" y="90.5" text-anchor="middle">Harvests</text><path class="sc-line" d="M242 101H284M242 109H274"/><path class="sc-line" d="M226 51L234 51"/><path class="sc-line" d="M195 68L195 82"/><path class="sc-line" d="M265 68L265 82"/><path class="sc-wire" d="M300 76L322 76"/><circle class="sc-pkt" cx="300" cy="76" r="2.6" style="--dx:22px;--dy:0px;--i:1"/><text class="sc-cap" x="326" y="22" text-anchor="start">TRIGGER</text><g class="sc-pop" style="--i:2"><rect class="sc-box sc-hot" x="326" y="36" width="178" height="80" rx="10"/><g class="sc-spin"><path class="sc-c1s" d="M350 62a14 14 0 1 1 -12 7"/><path class="sc-c1" d="M333 64l5 7 5-6z"/></g><text class="sc-t sc-sm" x="372" y="66" text-anchor="start">stage = Harvest</text><text class="sc-s" x="372" y="81" text-anchor="start">→ harvest + replant</text><text class="sc-s" x="372" y="96" text-anchor="start">PL/SQL · RBAC roles</text></g><text class="sc-s sc-foot" x="16" y="140" text-anchor="start">3 farms, 50,000+ transactions, 45% faster analytical queries</text></g>
